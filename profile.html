<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ваш профиль</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="profile-container">
    <h1>Ваш профиль</h1>
    
    <div class="profile-card">
      <div class="avatar">👤</div>
      <p id="user-email">Загрузка...</p>
      <p>Статус: <span id="user-status">в сети</span></p>
    </div>
    
    <div class="profile-actions">
      <a href="index.html" class="btn">Вернуться в чат</a>
      <a href="#" id="logout-btn" class="btn danger">Выйти</a>
    </div>
  </div>

  <script>
    // Инициализация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCPjjwqSk6EG6k3QZ6Yf5UzqDo5LEfo6GY",
      authDomain: "localhost-mini.firebaseapp.com",
      databaseURL: "https://localhost-mini-default-rtdb.firebaseio.com",
      projectId: "localhost-mini",
      storageBucket: "localhost-mini.firebasestorage.app",
      messagingSenderId: "465050030132",
      appId: "1:465050030132:web:49058758de3b054379ba61"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    // Проверка авторизации
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      document.getElementById('user-email').textContent = `Email: ${user.email}`;
    });
    
    // Выход из аккаунта
    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault();
      auth.signOut().then(() => window.location.href = 'login.html');
    });
  </script>
</body>
</html>
