<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalHost (mini)</title>
  <link rel="stylesheet" href="style.css">
  <!-- Используем модульный подход Firebase v9+ -->
  <script type="module">
    // Импортируем необходимые Firebase модули
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
    // Исправленный Firebase конфиг (убраны пробелы в databaseURL!)
    const firebaseConfig = {
      apiKey: "AIzaSyCPjjwqSk6EG6k3QZ6Yf5UzqDo5LEfo6GY",
      authDomain: "localhost-mini.firebaseapp.com",
      databaseURL: "https://localhost-mini-default-rtdb.firebaseio.com",
      projectId: "localhost-mini",
      storageBucket: "localhost-mini.firebasestorage.app",
      messagingSenderId: "465050030132",
      appId: "1:465050030132:web:49058758de3b054379ba61"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    // Глобальная обработка ошибок
    window.onerror = function(message, source, lineno, colno, error) {
      document.querySelector('.loading-text').textContent = 'Ошибка: ' + (error ? error.message : message);
      document.querySelector('.loading-text').style.color = '#ff4757';
      
      // Через 2 секунды перенаправляем на auth.html
      setTimeout(() => {
        window.location.href = 'auth.html';
      }, 2000);
      
      return true;
    };

    // Инициализация Firebase с обработкой ошибок
    document.addEventListener('DOMContentLoaded', () => {
      try {
        // Анимация загрузки
        const dots = document.querySelectorAll('.dot');
        const loadingText = document.querySelector('.loading-text');
        let dotIndex = 0;
        
        const dotAnimation = setInterval(() => {
          dots.forEach(dot => dot.style.opacity = '0.3');
          dots[dotIndex].style.opacity = '1';
          dotIndex = (dotIndex + 1) % dots.length;
        }, 300);
        
        // Таймаут на случай проблем с Firebase
        const firebaseTimeout = setTimeout(() => {
          clearInterval(dotAnimation);
          loadingText.textContent = 'Подключение заняло слишком много времени...';
          loadingText.style.color = '#ff4757';
          
          setTimeout(() => {
            window.location.href = 'auth.html';
          }, 1500);
        }, 8000);
        
        // Проверка аутентификации
        onAuthStateChanged(auth, (user) => {
          clearTimeout(firebaseTimeout);
          clearInterval(dotAnimation);
          
          loadingText.textContent = user ? 'Загрузка чата...' : 'Подготовка к авторизации...';
          
          setTimeout(() => {
            window.location.href = user ? 'chat.html' : 'auth.html';
          }, 500);
        }, (error) => {
          clearTimeout(firebaseTimeout);
          clearInterval(dotAnimation);
          loadingText.textContent = `Ошибка: ${error.message}`;
          loadingText.style.color = '#ff4757';
          
          setTimeout(() => {
            window.location.href = 'auth.html';
          }, 1500);
        });
        
      } catch (error) {
        console.error("Критическая ошибка инициализации Firebase:", error);
        document.querySelector('.loading-text').textContent = `Ошибка: ${error.message}`;
        document.querySelector('.loading-text').style.color = '#ff4757';
        
        setTimeout(() => {
          window.location.href = 'auth.html';
        }, 1500);
      }
    });
  </script>
</head>
<body class="loading-screen">
  <div class="loader-container">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>LocalHost (mini)</h1>
      <p>Быстрый чат для новых пользователей</p>
    </div>
    
    <div class="loading-animation">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <div class="loading-text">Подключение к серверу...</div>
  </div>
</body>
</html>
