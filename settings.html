<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
  <div class="settings-container">
    <h1>Настройки уведомлений</h1>
    
    <div class="setting-item">
      <label>
        <input type="checkbox" id="notifications-toggle" checked>
        Получать push-уведомления
      </label>
    </div>
    
    <div class="setting-info">
      <p>Уведомления приходят даже когда приложение закрыто</p>
    </div>
    
    <div class="settings-footer">
      <a href="index.html" class="btn">Назад в чат</a>
    </div>
  </div>

  <script>
    // Инициализация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCPjjwqSk6EG6k3QZ6Yf5UzqDo5LEfo6GY",
      authDomain: "localhost-mini.firebaseapp.com",
      databaseURL: "https://localhost-mini-default-rtdb.firebaseio.com",
      projectId: "localhost-mini",
      storageBucket: "localhost-mini.firebasestorage.app",
      messagingSenderId: "465050030132",
      appId: "1:465050030132:web:49058758de3b054379ba61"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const messaging = firebase.messaging();
    
    // Проверка авторизации
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      // Запрос разрешения для FCM
      const notifyToggle = document.getElementById('notifications-toggle');
      notifyToggle.addEventListener('change', async () => {
        if (notifyToggle.checked) {
          try {
            // ВАЖНО: Получи VAPID Key здесь:
            // Firebase Console → Project Settings → Cloud Messaging → "Web Push certificates" → "Generate Key"
            const vapidKey = "BJn6wv3qDvRdRZqVv7kQ7J8zX9yZ7yY5vX0sW1tR2uT3vU4wV5xW6yX7zY8aZ9bA0cB1dC2eD3fE4g";
            
            const token = await messaging.getToken({ vapidKey });
            console.log('FCM Token:', token);
            alert('Уведомления включены!');
          } catch (error) {
            console.error('Ошибка FCM:', error);
            alert('Не удалось включить уведомления');
            notifyToggle.checked = false;
          }
        }
      });
    });
  </script>
</body>
</html>
